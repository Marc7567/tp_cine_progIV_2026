<div class="card">
  <!-- Property Binding: mostramos la imagen de la película -->
  <img [src]="pelicula().imagen" [attr.alt]="'Póster de ' + pelicula().titulo" class="poster" />

  <div class="card-body">
    <!-- mostramos los datos de la película -->
    <h2>{{ pelicula().titulo }}</h2>
    <p class="synopsis">{{ pelicula().sinopsis }}</p>
    <p class="duration">Duración: {{ pelicula().duracion_minutos }} minutos</p>
    <p class="age">Edad mínima: {{ pelicula().edad_minima }} años</p>
  </div>
</div>

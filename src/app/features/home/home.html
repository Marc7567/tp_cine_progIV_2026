<section class="home-container">
  <h2>Catálogo de Películas</h2>

  <!-- Barra de busqueta por titulo -->
  <app-search-bar [(termino)]="filtroBusqueda" />
  <div class="genre-filter">
    <label for="genero">Filtrar por genero:</label>
    <select
      id="genero"
      [value]="generoSeleccionado()"
      (change)="generoSeleccionado.set($any($event.target).value)"
    >
      <option value="">Todos los generos</option>
      @for (genero of generos(); track genero) {
        <option [value]="genero">{{ genero }}</option>
      }
    </select>
  </div>

  <div class="movies-grid">
    @for (pelicula of peliculasFiltradas(); track pelicula.id_pelicula) {
      <div class="movie-wrapper">
        <!-- Detalles de la pelicula -->
        <app-pelicula-card [pelicula]="pelicula" />

        <!-- Boton de ver detalles -->
        <button class="detail-btn" (click)="verDetalle(pelicula.id_pelicula)">Ver Detalles</button>
      </div>
    } @empty {
      <div class="no-results">
        <p>No se encontraron peliculas para "{{ filtroBusqueda() }}"</p>
      </div>
    }
  </div>
  <router-outlet />
</section>

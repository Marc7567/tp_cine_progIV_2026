<header class="navbar">
  <div class="brand">
    <h1>Cine</h1>
  </div>

  <!-- Navegación declarativa con routerLink -->
  <!-- routerLinkActive agrega la clase 'active' a la ruta actual -->
  <nav class="nav-links">
    <a routerLink="/home" routerLinkActive="active">🏠 Inicio</a>
    <a routerLink="/proximamente" routerLinkActive="active">Proximamente</a>

    @if (authService.currentUser()) {
        <a routerLink="/mis-compras" routerLinkActive="active">Mis compras</a>
      <a routerLink="/perfil" routerLinkActive="active">Mi perfil</a>
      <a href="#" (click)="logout(); $event.preventDefault()">🚪 Cerrar sesión</a>
    } @else {
      <a routerLink="/login" routerLinkActive="active">🔑 Iniciar sesion</a>
    }
  </nav>
</header>
